groups:
  - name: slo-rules
    rules:
      - record: slo:availability:ratio
        expr: sum(rate(http_requests_total{status!~"5.."}[30d])) / sum(rate(http_requests_total[30d]))
      - record: slo:latency:ratio
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[30d]))
